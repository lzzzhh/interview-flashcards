name: Build Desktop Apps
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: macos
            bundles: dmg
            file_pattern: 'src-tauri/target/release/bundle/dmg/*.dmg'
          - os: windows-latest
            artifact_name: windows
            bundles: nsis
            file_pattern: 'src-tauri/target/release/bundle/nsis/*.exe'
          - os: ubuntu-latest
            artifact_name: linux
            bundles: deb,appimage
            file_pattern: 'src-tauri/target/release/bundle/deb/*.deb'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build:ci

      - name: Build Tauri app
        run: npx tauri build --bundles ${{ matrix.bundles }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.file_pattern }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
