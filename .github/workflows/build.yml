name: Build Desktop Apps
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable

      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev

      - run: npm install
      - run: npm run build
      - run: npm run tauri build
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

      - if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with: { files: 'src-tauri/target/release/bundle/dmg/*.dmg' }
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

      - if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with: { files: 'src-tauri/target/release/bundle/nsis/*.exe' }
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

      - if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with: { files: 'src-tauri/target/release/bundle/deb/*.deb' }
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
